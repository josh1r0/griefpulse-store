<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>SHADOWLAND — Discord</title><link rel="icon" href="favicon.ico"><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;color:#f8f2ff;font-family:system-ui,sans-serif;background:radial-gradient(ellipse at 50% 35%,#44216b,transparent 70%),#10071e}main{text-align:center;width:min(100%,420px);padding:32px;border:1px solid #b98ce255;border-radius:24px;background:#1c132eea;box-shadow:0 15px 70px #0005}img{width:85px;height:85px}h1{font-size:24px;margin:14px 0}p{font-size:14px;line-height:1.6;color:#cfc0e3}a{display:block;margin:22px 0 0;padding:14px;border-radius:12px;background:#8343d7;color:#fff;text-decoration:none;font-weight:700}a:focus-visible{outline:2px solid white;outline-offset:4px}
</style></head><body><main><img src="assets/art-v7/planet-3d.webp" alt=""><h1>SHADOWLAND · Discord</h1><p id="status" role="status">Получаем актуальное приглашение…</p><a href="https://discord.gg/9q6bw4eMwe">Вступить в Discord</a></main>
<script>
(async function(){
 const fallback="https://discord.gg/9q6bw4eMwe";
 const controller=new AbortController();
 const timer=setTimeout(()=>controller.abort(),3500);
 let destination=fallback;
 try{
  const response=await fetch("https://discord.com/api/guilds/1544619518255702108/widget.json",{cache:"no-store",signal:controller.signal,credentials:"omit",referrerPolicy:"no-referrer"});
  if(!response.ok)throw Error("Widget unavailable");
  const data=await response.json();
  if(data.id!=="1544619518255702108"||typeof data.instant_invite!=="string")throw Error("Invalid widget");
  const url=new URL(data.instant_invite);
  if(url.protocol!=="https:"||url.port||url.username||url.password||!((url.hostname==="discord.com"&&/^\/invite\/[A-Za-z0-9_-]+\/?$/.test(url.pathname))||(url.hostname==="discord.gg"&&/^\/[A-Za-z0-9_-]+\/?$/.test(url.pathname))))throw Error("Invalid invite");
  destination=url.href;
 }catch{}finally{clearTimeout(timer)}
 document.getElementById("status").textContent="Открываем Discord…";
 window.location.replace(destination);
})();
</script></body></html>
